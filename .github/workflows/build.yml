# build.yml - compila dso5200-openhantek (GUI + núcleo dso5200basic) en Linux x86_64 y ARM64.
# La GUI compila el núcleo desde ../../dso5200basic, así que se clonan los dos repos como hermanos.

name: Build

on: [push, pull_request]

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
    - name: Checkout GUI
      uses: actions/checkout@v6
      with:
        path: dso5200gui

    - name: Checkout núcleo (dso5200-cli)
      uses: actions/checkout@v6
      with:
        repository: eamadosuarez83/dso5200-cli
        path: dso5200basic

    - name: Dependencias
      run: |
        sudo apt update
        sudo apt install -y g++ make cmake libfftw3-dev libusb-1.0-0-dev libxkbcommon-dev \
          qt6-base-dev libqt6opengl6-dev qt6-tools-dev qt6-l10n-tools

    - name: Compilar
      run: |
        cmake -S dso5200gui -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build -j4
        test -x build/openhantek/OpenHantek
